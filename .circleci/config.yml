version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.10
  docker-executor:
    docker:
      - image: cimg/base:current

jobs:
  build-and-test:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Backend Dependencies
          command: cd Backend && npm ci
      - run:
          name: Install Frontend Dependencies
          command: cd FrontEnd && npm ci
      - run:
          name: Lint and Test Backend
          command: |
            cd Backend
            npm run lint || true
            npm run test
      - run:
          name: Lint Frontend
          command: |
            cd FrontEnd
            npm run lint || true

  docker-build:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Install Docker Compose
          command: |
            sudo apt-get update && sudo apt-get install -y docker-compose
      - run:
          name: Build Images
          command: docker-compose -f docker-compose.yml build

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - build-and-test
      - docker-build:
          requires:
            - build-and-test
